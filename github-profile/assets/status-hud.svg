<svg xmlns="http://www.w3.org/2000/svg" width="900" height="74" viewBox="0 0 900 74" role="img" aria-label="Live status HUD">
  <defs>
    <linearGradient id="pill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10141a"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="74" rx="14" fill="#06080d" stroke="rgba(242,240,234,0.14)"/>

  <rect x="18" y="16" width="150" height="42" rx="10" fill="url(#pill)" stroke="#d4b48a" stroke-width="1.5"/>
  <circle cx="44" cy="37" r="6" fill="#d4b48a">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="62" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700" fill="#d4b48a">ONLINE</text>

  <rect x="184" y="16" width="210" height="42" rx="10" fill="url(#pill)" stroke="#7ec8b8" stroke-width="1.5"/>
  <text x="204" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#7ec8b8">SYSTEMS NOMINAL</text>

  <rect x="410" y="16" width="200" height="42" rx="10" fill="url(#pill)" stroke="#8eb8c4" stroke-width="1.5"/>
  <text x="430" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#8eb8c4">DESIGN PATENT</text>

  <rect x="626" y="16" width="256" height="42" rx="10" fill="url(#pill)" stroke="#f2f0ea" stroke-width="1.5"/>
  <text x="646" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#f2f0ea">SHIPPING PRODUCTS</text>
  <rect x="848" y="30" width="18" height="14" fill="#d4b48a">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>
</svg>
