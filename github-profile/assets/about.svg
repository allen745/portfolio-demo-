<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Animated about me panel">
  <defs>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8eb8c4">
        <animate attributeName="stop-color" values="#8eb8c4;#d4b48a;#8eb8c4" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#d4b48a">
        <animate attributeName="stop-color" values="#d4b48a;#8eb8c4;#d4b48a" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="898" height="318" rx="16" fill="#06080d" stroke="url(#edge)" stroke-width="2"/>
  <rect x="18" y="18" width="864" height="36" rx="8" fill="#10141a"/>
  <circle cx="40" cy="36" r="5" fill="#d4b48a">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="58" y="41" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#d4b48a">about.allen.yaml</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">
    <text x="40" y="90" fill="#8B949E">
      <tspan fill="#7ec8b8">role</tspan>
      <tspan fill="#8B949E">: </tspan>
      <tspan fill="#f2f0ea">AI &amp; Data Science Engineer</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    </text>
    <text x="40" y="122" fill="#8B949E" opacity="0">
      <tspan fill="#7ec8b8">education</tspan>
      <tspan fill="#8B949E">: </tspan>
      <tspan fill="#f2f0ea">B.Tech AI &amp; Data Science · ADIT, CVM University</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.45s" fill="freeze"/>
    </text>
    <text x="40" y="154" fill="#8B949E" opacity="0">
      <tspan fill="#7ec8b8">credential</tspan>
      <tspan fill="#8B949E">: </tspan>
      <tspan fill="#d4b48a">Design Patent · Government of India</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.7s" fill="freeze"/>
    </text>
    <text x="40" y="186" fill="#8B949E" opacity="0">
      <tspan fill="#7ec8b8">focus</tspan>
      <tspan fill="#8B949E">: </tspan>
      <tspan fill="#8eb8c4">FastAPI · Agents · Products that ship</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.95s" fill="freeze"/>
    </text>
    <text x="40" y="218" fill="#8B949E" opacity="0">
      <tspan fill="#7ec8b8">habit</tspan>
      <tspan fill="#8B949E">: </tspan>
      <tspan fill="#f2f0ea">Clean APIs · measurable results · end-to-end delivery</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>
    </text>
    <text x="40" y="250" fill="#8B949E" opacity="0">
      <tspan fill="#7ec8b8">location</tspan>
      <tspan fill="#8B949E">: </tspan>
      <tspan fill="#f2f0ea">Gujarat, India</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.45s" fill="freeze"/>
    </text>
    <text x="40" y="282" fill="#8B949E" opacity="0">
      <tspan fill="#7ec8b8">next</tspan>
      <tspan fill="#8B949E">: </tspan>
      <tspan fill="#d4b48a" filter="url(#glow)">Machine Learning Engineer</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.7s" fill="freeze"/>
    </text>
  </g>
</svg>
