<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3344" stop-opacity="0"/>
      <stop offset="55%" stop-color="#1a2230" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0c1018" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="robe" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#9a1d24"/>
      <stop offset="45%" stop-color="#6e1218"/>
      <stop offset="100%" stop-color="#3a0a0e"/>
    </linearGradient>
    <linearGradient id="robeGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d48a"/>
      <stop offset="100%" stop-color="#b8893a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.3" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#f0c7a8"/>
      <stop offset="100%" stop-color="#c99272"/>
    </linearGradient>
    <linearGradient id="broom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a3a1c"/>
      <stop offset="40%" stop-color="#8b6232"/>
      <stop offset="100%" stop-color="#d4b06a"/>
    </linearGradient>
    <linearGradient id="hair" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#2a2430"/>
      <stop offset="100%" stop-color="#0d0b10"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#e8c27a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e8c27a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <style>
    .cape-a { transform-origin: 210px 150px; animation: capeWave 1.8s ease-in-out infinite alternate; }
    .cape-b { transform-origin: 220px 165px; animation: capeWave 2.2s ease-in-out infinite alternate-reverse; }
    .scarf { transform-origin: 270px 150px; animation: scarfFlick 1.5s ease-in-out infinite alternate; }
    .snitch { animation: snitchBob 1.1s ease-in-out infinite alternate; }
    @keyframes capeWave {
      from { transform: translate(0,0) rotate(0deg); }
      to { transform: translate(-6px, 4px) rotate(-3deg); }
    }
    @keyframes scarfFlick {
      from { transform: rotate(0deg); }
      to { transform: rotate(4deg); }
    }
    @keyframes snitchBob {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }
  </style>


  <!-- soft atmosphere -->
  <rect width="640" height="360" fill="url(#sky)"/>
  <ellipse cx="470" cy="120" rx="180" ry="100" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <!-- billowing robe / cape behind (left) -->
    <path class="cape-a" d="M210 150
      C160 120 90 130 50 170
      C70 200 120 230 170 235
      C145 210 155 180 210 150Z" fill="url(#robe)" opacity="0.92"/>
    <path class="cape-b" d="M220 165
      C170 155 110 175 80 215
      C115 245 165 255 210 245
      C195 220 200 190 220 165Z" fill="#7a1520" opacity="0.88"/>
    <path d="M215 155 C175 145 130 160 105 190" stroke="url(#robeGold)" stroke-width="3" stroke-linecap="round" opacity="0.75"/>

    <!-- broomstick -->
    <g>
      <!-- bristles -->
      <g stroke="#c9a25a" stroke-linecap="round" opacity="0.95">
        <path d="M95 215 L35 185" stroke-width="3.2"/>
        <path d="M95 218 L28 205" stroke-width="3.6"/>
        <path d="M96 222 L40 235" stroke-width="3.1"/>
        <path d="M98 225 L55 250" stroke-width="2.8"/>
        <path d="M100 212 L48 170" stroke-width="2.6"/>
        <path d="M102 220 L60 228" stroke-width="2.4"/>
      </g>
      <ellipse cx="100" cy="218" rx="14" ry="9" fill="#6b4522"/>
      <path d="M100 218 L430 155" stroke="url(#broom)" stroke-width="7" stroke-linecap="round"/>
      <path d="M100 221 L430 158" stroke="#3d2612" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
      <!-- handle tip -->
      <path d="M430 155 L468 148" stroke="#e8c27a" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="470" cy="147" r="4" fill="#f5e6b8"/>
    </g>

    <!-- torso / jersey -->
    <path d="M230 155
      C250 130 300 125 335 140
      C360 155 365 185 345 210
      C320 240 260 245 235 220
      C220 200 215 175 230 155Z" fill="url(#robe)"/>
    <!-- gold trim -->
    <path d="M255 145 C290 138 325 148 340 170" stroke="url(#robeGold)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M248 175 H330" stroke="#c9a25a" stroke-width="2.5" opacity="0.7"/>
    <!-- house crest hint -->
    <path d="M290 168 L300 155 L310 168 L300 185 Z" fill="#e8c27a" opacity="0.85"/>
    <circle cx="300" cy="172" r="5" fill="#7a1520"/>

    <!-- arms gripping broom -->
    <path d="M250 185 C280 195 320 185 360 170" stroke="url(#skin)" stroke-width="14" stroke-linecap="round"/>
    <path d="M250 185 C280 195 320 185 360 170" stroke="#8a1a22" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
    <ellipse cx="362" cy="170" rx="10" ry="8" fill="url(#skin)"/>
    <path d="M265 200 C295 215 330 205 355 185" stroke="url(#skin)" stroke-width="12" stroke-linecap="round" opacity="0.95"/>

    <!-- head looking back over shoulder -->
    <g transform="translate(300,95) rotate(-18)">
      <!-- neck -->
      <path d="M8 55 C14 68 28 72 40 66" stroke="url(#skin)" stroke-width="16" stroke-linecap="round"/>
      <!-- face -->
      <ellipse cx="28" cy="38" rx="28" ry="34" fill="url(#skin)"/>
      <!-- messy hair -->
      <path d="M-5 25
        C-10 -5 15 -18 40 -12
        C58 -8 62 10 55 28
        C48 18 35 12 20 14
        C8 16 0 22 -5 25Z" fill="url(#hair)"/>
      <path d="M5 8 C12 -6 28 -8 38 2" stroke="#1a1520" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M18 0 C24 -10 40 -8 46 6" stroke="#0d0b10" stroke-width="4" stroke-linecap="round" fill="none"/>
      <!-- ear -->
      <ellipse cx="2" cy="40" rx="7" ry="10" fill="#d4a888"/>
      <!-- glasses -->
      <g stroke="#d8dde6" stroke-width="2.2" fill="rgba(180,210,230,0.18)">
        <circle cx="18" cy="40" r="9"/>
        <circle cx="38" cy="38" r="9"/>
        <path d="M27 39 H29" stroke-width="2"/>
        <path d="M9 42 H0" stroke-width="2" fill="none"/>
      </g>
      <!-- eyes / brow -->
      <path d="M12 36 H24" stroke="#2a2430" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M32 34 H44" stroke="#2a2430" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="18" cy="41" r="2.2" fill="#1a1520"/>
      <circle cx="38" cy="39" r="2.2" fill="#1a1520"/>
      <!-- mouth focused -->
      <path d="M22 55 C26 58 32 57 36 53" stroke="#9a5a48" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    </g>

    <!-- scarf trailing -->
    <path class="scarf" d="M270 150 C250 170 240 200 255 230 C268 250 290 245 295 225" fill="none" stroke="#8a1a22" stroke-width="7" stroke-linecap="round"/>
    <path d="M270 150 C250 170 240 200 255 230" fill="none" stroke="#e8c27a" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- golden snitch ahead -->
  <g class="snitch">
    <ellipse cx="520" cy="95" rx="9" ry="7" fill="#f5d76e"/>
    <ellipse cx="520" cy="95" rx="9" ry="7" fill="#fff3b0" opacity="0.35"/>
    <path d="M512 93 C492 77 486 103 510 101" fill="rgba(255,255,255,0.55)" stroke="#e8e0c8" stroke-width="1"/>
    <path d="M528 93 C548 79 554 105 530 101" fill="rgba(255,255,255,0.55)" stroke="#e8e0c8" stroke-width="1"/>
    <circle cx="520" cy="95" r="18" fill="#f5d76e" opacity="0.18" filter="url(#soft)"/>
  </g>
</svg>
